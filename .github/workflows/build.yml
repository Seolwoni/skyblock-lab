name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: bundle noamm data
        run: |
          # Noamm's data (puzzle answers, room list...) is normally downloaded in game. Keep a copy in the jar
          # so the mod still works when api.noamm.org is down. Fresh copies are kept on the noamm-data branch.
          if curl -fsSL --retry 3 --max-time 60 -A "Marceline-CI" https://api.noamm.org/na/data/download -o /tmp/data.zip; then
            echo "fresh noamm data"
            mkdir -p /tmp/ndrepo && cd /tmp/ndrepo && git init -q && cp /tmp/data.zip . && git add data.zip \
              && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "noamm data $(date -u +%F)" \
              && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:noamm-data || true
            cd "$GITHUB_WORKSPACE"
          elif git fetch -q origin noamm-data 2>/dev/null && git show origin/noamm-data:data.zip > /tmp/data.zip; then
            echo "noamm data server down, using the saved copy"
          else
            echo "no noamm data available"; rm -f /tmp/data.zip
          fi
          if [ -s /tmp/data.zip ]; then
            python3 -c "
          import zipfile, os
          z = zipfile.ZipFile('/tmp/data.zip'); out = 'src/main/resources/noamm-data'
          for n in z.namelist():
              rel = n.split('/', 1)[1] if '/' in n else n
              if not rel or n.endswith('/'): continue
              p = os.path.join(out, rel); os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, 'wb').write(z.read(n))
          print(len(os.listdir(out)), 'data files bundled')
          "
          fi
      - name: version
        run: |
          # major.minor from gradle.properties, the last number is this build's number: 1.1.0 -> 1.1.<build>
          BASE=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | cut -d. -f1-2)
          echo "RW_VERSION=$BASE.${{ github.run_number }}" >> $GITHUB_ENV
      - name: build 26.2
        run: |
          set -o pipefail
          echo "Marceline $RW_VERSION"
          ./gradlew :26.2:build -Pmod_version=$RW_VERSION --stacktrace 2>&1 | tee build.log
      - name: unit tests
        id: unittest
        continue-on-error: true
        run: |
          ./gradlew :26.2:test --stacktrace 2>&1 | tail -60 | tee unittest.log
          test ${PIPESTATUS[0]} -eq 0
      - name: game test
        # off by default (tested by hand in game); a commit with [gametest] in its message runs it
        if: contains(github.event.head_commit.message, '[gametest]')
        id: gametest
        continue-on-error: true
        timeout-minutes: 30
        run: |
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils > /dev/null
          ./gradlew :26.2:downloadAssets > /dev/null 2>&1 || (sleep 15; ./gradlew :26.2:downloadAssets > /dev/null 2>&1) || true
          set -o pipefail
          start=$(date +%s)
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :26.2:runClientGameTest -Pmod_version=$RW_VERSION --stacktrace 2>&1 | tee gametest.log
          echo "gametest seconds: $(( $(date +%s) - start ))" >> gametest.log
      - name: build assist mods
        if: contains(github.event.head_commit.message, '[assist]')
        continue-on-error: true
        run: |
          mkdir -p /tmp/assist
          for r in assist-core assist-path; do
            git clone -q --depth 1 "https://github.com/Seolwoni/$r" "/tmp/src-$r"
            # The core/ folder inside each Assist mod is a copy of assist-core: refresh it to the latest.
            if [ "$r" != "assist-core" ] && [ -d "/tmp/src-$r/core" ]; then
              rm -rf "/tmp/src-$r/core/src" && cp -r /tmp/src-assist-core/src "/tmp/src-$r/core/src"
              cp /tmp/src-assist-core/build.gradle "/tmp/src-$r/core/build.gradle"
            fi
            (cd "/tmp/src-$r" && chmod +x gradlew && ./gradlew build -x test --stacktrace > "/tmp/assist/$r-build.log" 2>&1) || echo "$r build failed"
            find "/tmp/src-$r/build/libs" -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" -exec cp {} /tmp/assist/ \;
          done
          ls -la /tmp/assist
      - name: save log
        if: always()
        run: |
          mkdir -p /tmp/gt/shots
          echo "${{ steps.gametest.outcome }}" > /tmp/gt/outcome.txt
          [ -f gametest.log ] && grep -E -A3 "ERROR|Exception|FAIL|Caused by|AssertionError|What went wrong|gametest seconds" gametest.log | head -300 > /tmp/gt/errors.txt || true
          [ -f gametest.log ] && tail -150 gametest.log > /tmp/gt/tail.txt || true
          [ -f unittest.log ] && cp unittest.log /tmp/gt/unittest.txt || true
          find . -path "*test-results/test/*.xml" -not -path "./.git/*" -exec cat {} + 2>/dev/null | grep -oE '<testsuite [^>]*>|<testcase [^>]*name="[^"]*"|<failure [^>]*message="[^"]*"|MEASURE [^<]*' > /tmp/gt/unittest-results.txt || true
          find . -name "marceline-test-result.txt" -not -path "./.git/*" -exec cp {} /tmp/gt/ \; 2>/dev/null || true
          find . -name "*.png" -path "*screenshots*" -not -path "./.git/*" -exec cp {} /tmp/gt/shots/ \; 2>/dev/null || true
          LOG=$(find . -name "latest.log" -path "*run*" -not -path "./.git/*" | head -1); [ -n "$LOG" ] && grep -E -B2 -A8 "Exception|ERROR" "$LOG" | head -400 > /tmp/gt/latest-errors.txt || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          grep -E -A6 "error:|^e: " build.log | head -400 > /tmp/compile.txt || true
          tail -300 build.log > /tmp/tail.txt
          ls -la build/libs > /tmp/libs.txt 2>&1 || true
          for j in build/libs/Marceline-*-26.2.jar; do
            echo "== $j" >> /tmp/libs.txt
            unzip -l "$j" | grep -c "xyz/yourboykyle/secretroutes/.*class" >> /tmp/libs.txt || true
            echo "assist stubs in jar: $(unzip -l "$j" | grep -c "com/seolwoni/")" >> /tmp/libs.txt
            unzip -l "$j" | grep -E "features/impl/routes|secretroutes.mixins|assets/secretroutesmod/(rooms|secretlocations)" >> /tmp/libs.txt || true
            unzip -p "$j" fabric.mod.json >> /tmp/libs.txt || true
          done
          # [probe] commits: dump render API signatures and vanilla GUI shaders for reference
          if echo "${{ github.event.head_commit.message }}" | grep -q "\[probe\]"; then
            mkdir -p /tmp/probe
            MCJ=$(find ~/.gradle .gradle -name "*.jar" 2>/dev/null | grep -iE "minecraft-(merged|clientonly|common)" | grep -v sources | grep "26.2" | head -3)
            echo "$MCJ" > /tmp/probe/jars.txt
            for j in $MCJ; do
              unzip -l "$j" | grep -E "shaders/(core|include)/" >> /tmp/probe/shader-list.txt || true
              mkdir -p /tmp/probe/sh && (cd /tmp/probe/sh && unzip -o -q "$j" "assets/minecraft/shaders/core/gui*" "assets/minecraft/shaders/core/position_color*" "assets/minecraft/shaders/core/position_tex_color*" "assets/minecraft/shaders/include/*" 2>/dev/null) || true
              CLASSES=$( [ -f .github/probe-classes.txt ] && cat .github/probe-classes.txt || echo com.mojang.blaze3d.pipeline.RenderPipeline net.minecraft.client.gui.GuiGraphicsExtractor )
              for c in $CLASSES; do
                javap -p -cp "$j" "$c" >> /tmp/probe/javap.txt 2>&1 || true
              done
              # bytecode of a few classes, to see how vanilla does something (.github/probe-bytecode.txt)
              if [ -f .github/probe-bytecode.txt ]; then
                for c in $(cat .github/probe-bytecode.txt); do
                  javap -c -p -cp "$j" "$c" >> /tmp/probe/bytecode.txt 2>&1 || true
                done
              fi
            done
          fi
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          cp /tmp/compile.txt /tmp/tail.txt /tmp/libs.txt .
          cp -r /tmp/gt gt
          mkdir -p jar && cp build/libs/Marceline-*-26.2.jar jar/ 2>/dev/null || true
          cp /tmp/assist/*.jar jar/ 2>/dev/null || true
          mkdir -p gt && cp /tmp/assist/*-build.log gt/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }} ${{ env.RW_VERSION }}" > status.txt
          [ -d /tmp/probe ] && cp -r /tmp/probe probe || true
          git add compile.txt tail.txt libs.txt status.txt gt jar; [ -d probe ] && git add probe || true
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin ci-log
      - name: release
        if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RW_VERSION }}
          name: Marceline ${{ env.RW_VERSION }}
          body: "Marceline ${{ env.RW_VERSION }} - personal build for the private test server."
          files: build/libs/Marceline-*-26.2.jar
