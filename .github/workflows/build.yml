name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: build 26.2
        run: |
          set -o pipefail
          ./gradlew :26.2:build --stacktrace 2>&1 | tee build.log
      - name: save log
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          grep -E -A6 "error:|^e: " build.log | head -400 > /tmp/compile.txt || true
          tail -300 build.log > /tmp/tail.txt
          ls -la build/libs > /tmp/libs.txt 2>&1 || true
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          cp /tmp/compile.txt /tmp/tail.txt /tmp/libs.txt .
          echo "${{ github.sha }} ${{ job.status }}" > status.txt
          git add compile.txt tail.txt libs.txt status.txt
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin ci-log
      - name: upload jars
        uses: actions/upload-artifact@v4
        with:
          name: skyblocklab-26.2
          path: build/libs/*-26.2-*.jar
      - name: release
        if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SkyBlock Lab (build ${{ github.run_number }})
          body: "NoammAddons + Secret Routes, 개인 맵 전용. cheat jar 사용."
          files: build/libs/*-26.2-cheat.jar
