// SkyBlock Lab: dungeon helper for testing on a private map. Made by seolwoni.
plugins {
	id 'net.fabricmc.fabric-loom'
}

version = '0.1.0'
group = 'com.seolwoni.skyblocklab'

base {
	archivesName = 'skyblocklab'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

jar {
	// Mod Menu API stubs are only for compiling; the real classes come from Mod Menu itself.
	exclude 'com/terraformersmc/**'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// CI helper: dumps the signatures of the game classes this mod touches, so mixin targets can be checked.
tasks.register('probeApi') {
	doLast {
		def jars = configurations.compileClasspath.files.findAll { it.name.contains('minecraft') }
		def out = file("$buildDir/probe.txt")
		out.text = jars.collect { it.name }.join('\n') + '\n\n'
		def classes = [
			'net.minecraft.client.Minecraft',
			'net.minecraft.world.entity.Entity',
			'net.minecraft.world.item.ItemStack',
			'net.minecraft.client.multiplayer.MultiPlayerGameMode',
			'net.minecraft.client.gui.screens.inventory.AbstractContainerScreen',
			'net.minecraft.client.multiplayer.ClientPacketListener',
		]
		jars.each { jar ->
			classes.each { c ->
				def p = ['javap', '-p', '-cp', jar.absolutePath, c].execute()
				def text = p.text
				p.waitFor()
				if (text) out << "=== $c (${jar.name})\n" << text << '\n'
			}
		}
	}
}
